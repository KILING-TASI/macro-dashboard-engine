[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-dashboard-engine"
version = "1.7.6"
description = "独立研究工具与完整资源；未知证据保留"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
macro-dashboard-engine = "macro_dashboard._entry:main"

[tool.setuptools]
packages = ["macro_dashboard"]
package-dir = {"macro_dashboard" = "macro_dashboard"}

[tool.setuptools.data-files]
"share/macro-dashboard-engine" = ["SHARED_CODE.json", "RIGHTS_INDEX.json", "CONTRIBUTING.md", "SECURITY.md", "LIFECYCLE.md"]
